<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALTER EGO — Streak Achievement Animation</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#07080F; min-height:100vh; font-family:'Inter',system-ui,sans-serif; }

/* ── TIER CONFIG ── */
/* tier data injected via JS into CSS vars on the overlay */

/* ── KEYFRAMES ── */
@keyframes bloom-in {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(0.3); }
  100% { opacity:1; transform:translate(-50%,-50%) scale(1); }
}
@keyframes overlay-in {
  0%   { opacity:0; }
  100% { opacity:1; }
}
@keyframes overlay-out {
  0%   { opacity:1; }
  100% { opacity:0; }
}
@keyframes stamp-in {
  0%   { opacity:0; transform:translateY(-22px) scale(1.06); filter:blur(6px); }
  55%  { opacity:1; transform:translateY(3px) scale(0.985); filter:blur(0); }
  75%  { transform:translateY(-1px) scale(1.004); }
  100% { transform:translateY(0) scale(1); opacity:1; }
}
@keyframes shockwave {
  0%   { transform:translate(-50%,-50%) scale(0.6); opacity:0.7; }
  100% { transform:translate(-50%,-50%) scale(3.5); opacity:0; }
}
@keyframes ring-stamp {
  0%   { opacity:0; transform:scale(0.82) rotate(-4deg); }
  60%  { opacity:1; transform:scale(1.02) rotate(0.5deg); }
  100% { opacity:1; transform:scale(1) rotate(0); }
}
@keyframes ornament-in {
  0%   { opacity:0; transform:scale(0.7); }
  100% { opacity:1; transform:scale(1); }
}
@keyframes label-rise {
  0%   { opacity:0; transform:translateY(12px); }
  100% { opacity:1; transform:translateY(0); }
}
@keyframes badge-drop {
  0%   { opacity:0; transform:translateY(-10px) scale(0.85); }
  100% { opacity:1; transform:translateY(0) scale(1); }
}
@keyframes outer-spin {
  from { transform:rotate(0deg); }
  to   { transform:rotate(360deg); }
}
@keyframes outer-spin-rev {
  from { transform:rotate(0deg); }
  to   { transform:rotate(-360deg); }
}
@keyframes flame-in {
  0%   { opacity:0; transform:scale(0.5); filter:drop-shadow(0 0 0 rgba(249,115,22,0)); }
  60%  { opacity:1; transform:scale(1.2); filter:drop-shadow(0 0 12px rgba(249,115,22,0.8)); }
  100% { opacity:1; transform:scale(1);   filter:drop-shadow(0 0 8px rgba(249,115,22,0.55)); }
}
@keyframes tick-in {
  0%   { opacity:0; }
  100% { opacity:1; }
}
@keyframes pulse-ring {
  0%   { opacity:0.5; transform:translate(-50%,-50%) scale(1); }
  100% { opacity:0;   transform:translate(-50%,-50%) scale(1.8); }
}
@keyframes legend-glow {
  0%,100% { filter:drop-shadow(0 0 12px var(--glow)); }
  50%      { filter:drop-shadow(0 0 28px var(--glow)); }
}

/* ── OVERLAY ── */
.sa-overlay {
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:rgba(3,3,11,0.93);
  backdrop-filter:blur(12px);
  animation:overlay-in 0.25s ease forwards;
  cursor:pointer;
}
.sa-overlay.out { animation:overlay-out 0.35s ease forwards; }

/* ── STAGE ── */
.sa-stage {
  position:relative;
  width:360px; height:460px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}

/* ── ATMOSPHERIC BLOOM ── */
.sa-bloom {
  position:absolute; top:50%; left:50%;
  border-radius:50%; pointer-events:none;
  animation:bloom-in 0.8s cubic-bezier(0.2,0.8,0.3,1) forwards;
}

/* ── SHOCKWAVE ── */
.sa-shock {
  position:absolute; top:50%; left:50%;
  border-radius:50%; pointer-events:none;
  animation:shockwave 0.55s 0.72s cubic-bezier(0.2,0.6,0.3,1) forwards;
  opacity:0;
}

/* ── SEAL RING WRAPPER ── */
.sa-ring-wrap {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.sa-ring-svg {
  animation:ring-stamp 0.45s 0.38s cubic-bezier(0.2,0.8,0.3,1) both;
}
.sa-outer-ring-wrap {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.sa-outer-ring {
  transform-origin:center;
  pointer-events:none;
}
.sa-outer-ring.spin  { animation:outer-spin     20s linear infinite; }
.sa-outer-ring.rspin { animation:outer-spin-rev 28s linear infinite; }
.sa-tick-ring {
  animation:tick-in 0.3s 0.65s ease forwards;
  opacity:0;
}

/* ── NUMBER HERO ── */
.sa-num-wrap {
  position:relative; z-index:10;
  display:flex; flex-direction:column;
  align-items:center;
  animation:stamp-in 0.5s 0.55s cubic-bezier(0.3,0.9,0.4,1) both;
}
.sa-flame {
  line-height:1; margin-bottom:2px;
  animation:flame-in 0.45s 0.48s ease both;
}
.sa-number {
  font-weight:900; line-height:1; letter-spacing:-3px;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:legend-glow 2.5s 1.1s ease-in-out infinite;
}

/* ── BADGE ── */
.sa-badge {
  font-size:9px; font-weight:700; letter-spacing:3px;
  text-transform:uppercase; padding:3px 14px; border-radius:20px;
  margin-bottom:6px;
  animation:badge-drop 0.35s 0.90s cubic-bezier(0.3,0.9,0.4,1) both;
}

/* ── ORNAMENT (milestone-specific) ── */
.sa-ornament {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  animation:ornament-in 0.4s 0.85s ease both;
}

/* ── LABELS ── */
.sa-label-streak {
  font-size:12px; font-weight:700; letter-spacing:4px;
  text-transform:uppercase;
  animation:label-rise 0.35s 1.0s ease both; opacity:0;
  margin-top:6px;
}
.sa-label-day {
  font-size:11px; font-weight:500; letter-spacing:2px;
  text-transform:uppercase; color:#374151;
  animation:label-rise 0.35s 1.12s ease both; opacity:0;
  margin-top:4px;
}
.sa-label-sub {
  font-size:10px; letter-spacing:1px; text-transform:uppercase;
  animation:label-rise 0.35s 1.22s ease both; opacity:0;
  margin-top:3px;
}
.sa-dismiss {
  position:absolute; bottom:24px;
  font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
  color:#2D3146;
  animation:label-rise 0.35s 1.5s ease both; opacity:0;
}

/* ── CORNER MARKS ── */
.sa-mark {
  position:absolute; pointer-events:none;
  animation:ornament-in 0.3s 0.92s ease both; opacity:0;
}
.sa-mark div {
  position:absolute; border-radius:1px;
}

/* ── DEMO CONTROLS ── */
.demo-wrap {
  max-width:800px; margin:40px auto; padding:0 20px;
}
.demo-title {
  font-size:12px; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; color:#374151;
  text-align:center; margin-bottom:20px;
}
.demo-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:10px; margin-bottom:30px;
}
.demo-btn {
  padding:10px 12px; border-radius:12px; font-size:12px; font-weight:700;
  cursor:pointer; border:1px solid rgba(139,92,246,0.25);
  background:rgba(109,40,217,0.08); color:#8B5CF6;
  letter-spacing:0.5px; text-align:center; transition:all 0.2s;
}
.demo-btn:hover { background:rgba(109,40,217,0.18); border-color:rgba(139,92,246,0.5); }
.demo-btn.gold { border-color:rgba(251,191,36,0.30); background:rgba(120,53,15,0.12); color:#FBBF24; }
.demo-btn.gold:hover { background:rgba(120,53,15,0.24); }
.demo-btn.legend { border-color:rgba(52,211,153,0.30); background:rgba(6,78,59,0.12); color:#34D399; }
.demo-btn.legend:hover { background:rgba(6,78,59,0.22); }
</style>
</head>
<body>

<div class="demo-wrap">
  <div class="demo-title">ALTER EGO · Streak Achievement Animation · The Seal</div>
  <div class="demo-grid">
    <div class="demo-btn" onclick="showStreak(1)">Day 1</div>
    <div class="demo-btn" onclick="showStreak(3)">Day 3</div>
    <div class="demo-btn" onclick="showStreak(7)">Day 7</div>
    <div class="demo-btn" onclick="showStreak(14)">Day 14</div>
    <div class="demo-btn" onclick="showStreak(21)">Day 21</div>
    <div class="demo-btn gold" onclick="showStreak(30)">Day 30 ✦</div>
    <div class="demo-btn gold" onclick="showStreak(60)">Day 60 ✦</div>
    <div class="demo-btn gold" onclick="showStreak(100)">Day 100 ✦</div>
    <div class="demo-btn gold" onclick="showStreak(200)">Day 200 ✦</div>
    <div class="demo-btn legend" onclick="showStreak(365)">Day 365 ✦</div>
  </div>
</div>

<script>
// ── TIER DEFINITIONS ──
const TIERS = {
  standard: {
    bloomColor: 'rgba(109,40,217,0.28)',
    bloomSize: 340,
    shockColor: 'rgba(139,92,246,0.25)',
    numGradient: ['#EDE9FE','#C4B5FD','#8B5CF6','#4C1D95'],
    glowColor: 'rgba(139,92,246,0.50)',
    numSize: 108,
    ringColor: 'rgba(139,92,246,0.55)',
    ringInnerColor: 'rgba(109,40,217,0.25)',
    outerDash: '3 12',
    outerColor: 'rgba(139,92,246,0.18)',
    tickColor: null,
    streakLabelColor: '#6B7280',
    badge: null,
    ornament: null,
    flameSize: 28,
    spinSpeed: 18,
  },
  day30: {
    bloomColor: 'rgba(180,83,9,0.35)',
    bloomSize: 380,
    shockColor: 'rgba(251,191,36,0.30)',
    numGradient: ['#FEF3C7','#FBBF24','#D97706'],
    glowColor: 'rgba(245,158,11,0.55)',
    numSize: 108,
    ringColor: 'rgba(251,191,36,0.70)',
    ringInnerColor: 'rgba(120,53,15,0.30)',
    outerDash: '2 8',
    outerColor: 'rgba(251,191,36,0.25)',
    tickColor: 'rgba(251,191,36,0.40)',
    streakLabelColor: '#FBBF24',
    badge: null,
    ornament: 'ticks_30',
    flameSize: 30,
    spinSpeed: 24,
  },
  day60: {
    bloomColor: 'rgba(120,10,10,0.35)',
    bloomSize: 400,
    shockColor: 'rgba(239,68,68,0.25)',
    numGradient: ['#FCA5A5','#EF4444','#991B1B'],
    glowColor: 'rgba(239,68,68,0.50)',
    numSize: 112,
    ringColor: 'rgba(239,68,68,0.65)',
    ringInnerColor: 'rgba(127,29,29,0.30)',
    outerDash: '2 6',
    outerColor: 'rgba(239,68,68,0.22)',
    tickColor: 'rgba(239,68,68,0.35)',
    streakLabelColor: '#FCA5A5',
    badge: null,
    ornament: 'double_ring',
    flameSize: 32,
    spinSpeed: 20,
  },
  day100: {
    bloomColor: 'rgba(146,64,14,0.42)',
    bloomSize: 420,
    shockColor: 'rgba(251,191,36,0.40)',
    numGradient: ['#FEF3C7','#FCD34D','#F59E0B','#D97706'],
    glowColor: 'rgba(251,191,36,0.60)',
    numSize: 116,
    ringColor: 'rgba(251,191,36,0.80)',
    ringInnerColor: 'rgba(146,64,14,0.35)',
    outerDash: '2 5',
    outerColor: 'rgba(251,191,36,0.30)',
    tickColor: 'rgba(251,191,36,0.50)',
    streakLabelColor: '#FCD34D',
    badge: { text: 'CENTURY', bg: 'rgba(120,53,15,0.40)', border: 'rgba(251,191,36,0.45)', color: '#FCD34D' },
    ornament: 'triple_ring',
    flameSize: 34,
    spinSpeed: 16,
  },
  day200: {
    bloomColor: 'rgba(120,53,15,0.45)',
    bloomSize: 440,
    shockColor: 'rgba(251,191,36,0.45)',
    numGradient: ['#FFF7ED','#FDE68A','#FBBF24','#B45309'],
    glowColor: 'rgba(245,158,11,0.65)',
    numSize: 116,
    ringColor: 'rgba(251,191,36,0.85)',
    ringInnerColor: 'rgba(120,53,15,0.40)',
    outerDash: '1 4',
    outerColor: 'rgba(251,191,36,0.35)',
    tickColor: 'rgba(251,191,36,0.55)',
    streakLabelColor: '#FDE68A',
    badge: { text: 'SOVEREIGN', bg: 'rgba(120,53,15,0.45)', border: 'rgba(251,191,36,0.55)', color: '#FDE68A' },
    ornament: 'star_compass',
    flameSize: 34,
    spinSpeed: 14,
  },
  day365: {
    bloomColor: 'rgba(6,78,59,0.50)',
    bloomSize: 480,
    shockColor: 'rgba(52,211,153,0.40)',
    numGradient: ['#ECFDF5','#A7F3D0','#34D399','#059669'],
    glowColor: 'rgba(52,211,153,0.65)',
    numSize: 120,
    ringColor: 'rgba(52,211,153,0.90)',
    ringInnerColor: 'rgba(6,78,59,0.40)',
    outerDash: '1 3',
    outerColor: 'rgba(52,211,153,0.35)',
    tickColor: 'rgba(52,211,153,0.60)',
    streakLabelColor: '#A7F3D0',
    badge: { text: 'LEGENDARY', bg: 'rgba(6,78,59,0.50)', border: 'rgba(52,211,153,0.60)', color: '#A7F3D0' },
    ornament: 'sun_rose',
    flameSize: 36,
    spinSpeed: 10,
  },
};

function getTier(n) {
  if (n >= 365) return TIERS.day365;
  if (n >= 200) return TIERS.day200;
  if (n >= 100) return TIERS.day100;
  if (n >= 60)  return TIERS.day60;
  if (n >= 30)  return TIERS.day30;
  return TIERS.standard;
}

function getOrdinal(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

// ── ORNAMENT SVGs ──
function buildOrnament(type, t) {
  const c = t.ringColor;
  const ic = t.ringInnerColor;
  const el = document.createElement('div');
  el.className = 'sa-ornament';

  if (type === 'ticks_30') {
    // 30 tick marks around outer radius
    const size = 260;
    let svgContent = `<circle cx="${size/2}" cy="${size/2}" r="${size/2-4}" fill="none" stroke="${c}" stroke-width="0.5" stroke-dasharray="1 ${(2*Math.PI*(size/2-4)/30 - 1).toFixed(1)}"/>`;
    // 12 longer ticks at clock positions
    for (let i = 0; i < 30; i++) {
      const angle = (i / 30) * 2 * Math.PI - Math.PI/2;
      const isMajor = i % 5 === 0;
      const r1 = size/2 - 6;
      const r2 = isMajor ? size/2 - 14 : size/2 - 10;
      const x1 = size/2 + r1 * Math.cos(angle);
      const y1 = size/2 + r1 * Math.sin(angle);
      const x2 = size/2 + r2 * Math.cos(angle);
      const y2 = size/2 + r2 * Math.sin(angle);
      svgContent += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="${isMajor?1.2:0.7}" stroke-linecap="round" opacity="${isMajor?0.8:0.5}"/>`;
    }
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">${svgContent}</svg>`;

  } else if (type === 'double_ring') {
    const size = 280;
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
      <circle cx="${size/2}" cy="${size/2}" r="${size/2-6}" fill="none" stroke="${c}" stroke-width="0.8" opacity="0.6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${size/2-16}" fill="none" stroke="${c}" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4"/>
      ${Array.from({length:36}).map((_,i)=>{
        const a=(i/36)*2*Math.PI-Math.PI/2;
        const r=size/2-10; const s=size/2+r*Math.cos(a); const t2=size/2+r*Math.sin(a);
        return `<circle cx="${s.toFixed(1)}" cy="${t2.toFixed(1)}" r="${i%9===0?2:0.8}" fill="${c}" opacity="${i%9===0?0.7:0.3}"/>`;
      }).join('')}
    </svg>`;

  } else if (type === 'triple_ring') {
    const size = 300;
    let ticks = '';
    for (let i = 0; i < 60; i++) {
      const a = (i/60)*2*Math.PI - Math.PI/2;
      const isM = i%5===0, isQ = i%15===0;
      const r1=size/2-5, r2=size/2-(isQ?20:isM?14:9);
      ticks += `<line x1="${(size/2+r1*Math.cos(a)).toFixed(1)}" y1="${(size/2+r1*Math.sin(a)).toFixed(1)}" x2="${(size/2+r2*Math.cos(a)).toFixed(1)}" y2="${(size/2+r2*Math.sin(a)).toFixed(1)}" stroke="${c}" stroke-width="${isQ?1.5:isM?1:0.6}" stroke-linecap="round" opacity="${isQ?0.9:isM?0.6:0.35}"/>`;
    }
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
      <circle cx="${size/2}" cy="${size/2}" r="${size/2-5}" fill="none" stroke="${c}" stroke-width="1" opacity="0.7"/>
      <circle cx="${size/2}" cy="${size/2}" r="${size/2-18}" fill="none" stroke="${c}" stroke-width="0.6" opacity="0.4"/>
      <circle cx="${size/2}" cy="${size/2}" r="${size/2-28}" fill="none" stroke="${ic}" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.3"/>
      ${ticks}
    </svg>`;

  } else if (type === 'star_compass') {
    // 4 pointed star ornaments at N/S/E/W + diagonal lines
    const size = 320;
    const cx = size/2, cy = size/2, r = size/2 - 8;
    const star = (x,y,s,rot) => {
      const pts = Array.from({length:8}).map((_,i)=>{
        const a = (i/8)*2*Math.PI + rot;
        const ri = i%2===0 ? s : s*0.45;
        return `${(x+ri*Math.cos(a)).toFixed(2)},${(y+ri*Math.sin(a)).toFixed(2)}`;
      }).join(' ');
      return `<polygon points="${pts}" fill="${c}" opacity="0.7"/>`;
    };
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="0.8" opacity="0.6"/>
      <circle cx="${cx}" cy="${cy}" r="${r-12}" fill="none" stroke="${c}" stroke-width="0.5" stroke-dasharray="3 9" opacity="0.35"/>
      <!-- N/S/E/W stars -->
      ${star(cx, cy-r+5, 8, -Math.PI/2)}
      ${star(cx, cy+r-5, 8, Math.PI/2)}
      ${star(cx-r+5, cy, 8, Math.PI)}
      ${star(cx+r-5, cy, 8, 0)}
      <!-- Diagonal small diamonds -->
      ${star(cx+0.707*(r-8), cy-0.707*(r-8), 4, -Math.PI/4)}
      ${star(cx+0.707*(r-8), cy+0.707*(r-8), 4, Math.PI/4)}
      ${star(cx-0.707*(r-8), cy-0.707*(r-8), 4, -3*Math.PI/4)}
      ${star(cx-0.707*(r-8), cy+0.707*(r-8), 4, 3*Math.PI/4)}
      <!-- Cross lines through center -->
      <line x1="${cx}" y1="${cy-r+16}" x2="${cx}" y2="${cy+r-16}" stroke="${c}" stroke-width="0.4" opacity="0.20"/>
      <line x1="${cx-r+16}" y1="${cy}" x2="${cx+r-16}" y2="${cy}" stroke="${c}" stroke-width="0.4" opacity="0.20"/>
    </svg>`;

  } else if (type === 'sun_rose') {
    // Full compass rose + sun rays for 365 legendary
    const size = 340;
    const cx = size/2, cy = size/2;
    let rays = '';
    for (let i = 0; i < 24; i++) {
      const a = (i/24)*2*Math.PI - Math.PI/2;
      const isMajor = i%6===0, isMed = i%3===0;
      const r1 = isMajor ? size/2-5 : isMed ? size/2-8 : size/2-10;
      const r2 = isMajor ? size/2-22 : isMed ? size/2-18 : size/2-14;
      rays += `<line x1="${(cx+r1*Math.cos(a)).toFixed(1)}" y1="${(cy+r1*Math.sin(a)).toFixed(1)}" x2="${(cx+r2*Math.cos(a)).toFixed(1)}" y2="${(cy+r2*Math.sin(a)).toFixed(1)}" stroke="${t.ringColor}" stroke-width="${isMajor?2:isMed?1.2:0.6}" stroke-linecap="round" opacity="${isMajor?0.9:isMed?0.6:0.35}"/>`;
    }
    // 4 arrow-head compass points
    const arrow = (angle, len) => {
      const a = angle * Math.PI/180 - Math.PI/2;
      const r = size/2 - 4;
      const tx = cx + r*Math.cos(a), ty = cy + r*Math.sin(a);
      const bx = cx + (r-len)*Math.cos(a), by = cy + (r-len)*Math.sin(a);
      const lx = cx + (r-len*0.6)*Math.cos(a-0.3), ly = cy + (r-len*0.6)*Math.sin(a-0.3);
      const rx2 = cx + (r-len*0.6)*Math.cos(a+0.3), ry2 = cy + (r-len*0.6)*Math.sin(a+0.3);
      return `<polygon points="${tx.toFixed(1)},${ty.toFixed(1)} ${lx.toFixed(1)},${ly.toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)} ${rx2.toFixed(1)},${ry2.toFixed(1)}" fill="${t.ringColor}" opacity="0.8"/>`;
    };
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
      <circle cx="${cx}" cy="${cy}" r="${size/2-4}" fill="none" stroke="${t.ringColor}" stroke-width="1" opacity="0.65"/>
      <circle cx="${cx}" cy="${cy}" r="${size/2-20}" fill="none" stroke="${t.ringColor}" stroke-width="0.5" opacity="0.3"/>
      ${rays}
      ${arrow(0,24)}${arrow(90,24)}${arrow(180,24)}${arrow(270,24)}
      ${arrow(45,14)}${arrow(135,14)}${arrow(225,14)}${arrow(315,14)}
      <circle cx="${cx}" cy="${cy}" r="6" fill="none" stroke="${t.ringColor}" stroke-width="1.5" opacity="0.6"/>
      <circle cx="${cx}" cy="${cy}" r="2" fill="${t.ringColor}" opacity="0.5"/>
    </svg>`;
  }
  return el;
}

// ── SEAL RING SVG ──
function buildSealRing(t, size) {
  const c = t.ringColor, ic = t.ringInnerColor;
  const r1 = size/2 - 4, r2 = size/2 - 16;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="sa-ring-svg">
    <defs>
      <linearGradient id="sealGrad_${size}" gradientTransform="rotate(135)">
        ${t.numGradient.map((c2,i,arr)=>`<stop offset="${(i/(arr.length-1)*100).toFixed(0)}%" stop-color="${c2}"/>`).join('')}
      </linearGradient>
    </defs>
    <!-- Outer seal ring -->
    <circle cx="${size/2}" cy="${size/2}" r="${r1}" fill="none" stroke="${c}" stroke-width="1.5" opacity="0.8"/>
    <!-- Inner accent ring -->
    <circle cx="${size/2}" cy="${size/2}" r="${r2}" fill="${ic}" stroke="${c}" stroke-width="0.6" opacity="0.5"/>
    <!-- 4 cardinal marks -->
    ${[0,90,180,270].map(deg=>{
      const a=deg*Math.PI/180-Math.PI/2;
      const mx=size/2+(r1-1)*Math.cos(a), my=size/2+(r1-1)*Math.sin(a);
      return `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="2.5" fill="${c}" opacity="0.8"/>`;
    }).join('')}
    <!-- 4 inter-cardinal small dots -->
    ${[45,135,225,315].map(deg=>{
      const a=deg*Math.PI/180-Math.PI/2;
      const mx=size/2+(r1-1)*Math.cos(a), my=size/2+(r1-1)*Math.sin(a);
      return `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="1.2" fill="${c}" opacity="0.5"/>`;
    }).join('')}
  </svg>`;
}

// ── MAIN ──
function showStreak(n) {
  const existing = document.getElementById('sa-overlay');
  if (existing) existing.remove();

  const t = getTier(n);

  const overlay = document.createElement('div');
  overlay.className = 'sa-overlay';
  overlay.id = 'sa-overlay';
  overlay.style.setProperty('--glow', t.glowColor);

  const stage = document.createElement('div');
  stage.className = 'sa-stage';

  // Atmospheric bloom
  const bloom = document.createElement('div');
  bloom.className = 'sa-bloom';
  bloom.style.cssText = `width:${t.bloomSize}px;height:${t.bloomSize}px;background:radial-gradient(circle,${t.bloomColor} 0%,transparent 65%);`;
  stage.appendChild(bloom);

  // Shockwave
  const shock = document.createElement('div');
  shock.className = 'sa-shock';
  shock.style.cssText = `width:140px;height:140px;border:1.5px solid ${t.shockColor};`;
  stage.appendChild(shock);

  // Corner marks
  const markPositions = [
    {top:'60px',left:'60px',tl:true},
    {top:'60px',right:'60px',tr:true},
    {bottom:'90px',left:'60px',bl:true},
    {bottom:'90px',right:'60px',br:true},
  ];
  markPositions.forEach(pos => {
    const m = document.createElement('div');
    m.className = 'sa-mark';
    const posStyles = Object.entries(pos).filter(([k])=>k!=='tl'&&k!=='tr'&&k!=='bl'&&k!=='br').map(([k,v])=>`${k}:${v}`).join(';');
    m.style.cssText = posStyles;
    const isRight = pos.tr||pos.br, isBottom = pos.bl||pos.br;
    m.innerHTML = `
      <div style="position:absolute;${isRight?'right':'left'}:0;${isBottom?'bottom':'top'}:0;width:1px;height:12px;background:${t.ringColor};opacity:0.6;"></div>
      <div style="position:absolute;${isRight?'right':'left'}:0;${isBottom?'bottom':'top'}:0;width:12px;height:1px;background:${t.ringColor};opacity:0.6;"></div>
    `;
    stage.appendChild(m);
  });

  // Spinning outer dashed ring
  const sSize = 220;
  const spinDiv = document.createElement('div');
  spinDiv.className = 'sa-outer-ring spin';
  spinDiv.style.cssText = `width:${sSize}px;height:${sSize}px;transform:translate(-50%,-50%);animation-duration:${t.spinSpeed}s;`;
  spinDiv.innerHTML = `<svg width="${sSize}" height="${sSize}" viewBox="0 0 ${sSize} ${sSize}"><circle cx="${sSize/2}" cy="${sSize/2}" r="${sSize/2-2}" fill="none" stroke="${t.outerColor}" stroke-width="0.8" stroke-dasharray="${t.outerDash}"/></svg>`;
  const spinWrap = document.createElement('div');
  spinWrap.className = 'sa-outer-ring-wrap';
  spinWrap.style.cssText = `width:${sSize}px;height:${sSize}px;`;
  spinDiv.style.cssText = `width:${sSize}px;height:${sSize}px;animation-duration:${t.spinSpeed}s;`;
  spinWrap.appendChild(spinDiv);
  stage.appendChild(spinWrap);

  // Counter-rotating inner dashed ring
  const s2Size = 180;
  const spinDiv2 = document.createElement('div');
  spinDiv2.className = 'sa-outer-ring rspin';
  const spinWrap2 = document.createElement('div');
  spinWrap2.className = 'sa-outer-ring-wrap';
  spinWrap2.style.cssText = `width:${s2Size}px;height:${s2Size}px;`;
  spinDiv2.style.cssText = `width:${s2Size}px;height:${s2Size}px;animation-duration:${t.spinSpeed*1.4}s;`;
  spinDiv2.innerHTML = `<svg width="${s2Size}" height="${s2Size}" viewBox="0 0 ${s2Size} ${s2Size}"><circle cx="${s2Size/2}" cy="${s2Size/2}" r="${s2Size/2-2}" fill="none" stroke="${t.outerColor}" stroke-width="0.5" stroke-dasharray="1 14" opacity="0.5"/></svg>`;
  spinWrap2.appendChild(spinDiv2);
  stage.appendChild(spinWrap2);

  // Milestone ornament
  if (t.ornament) {
    stage.appendChild(buildOrnament(t.ornament, t));
  }

  // Seal ring
  const ringWrap = document.createElement('div');
  ringWrap.className = 'sa-ring-wrap';
  const ringSize = 160;
  ringWrap.style.cssText = `width:${ringSize}px;height:${ringSize}px;transform:translate(-50%,-50%);`;
  ringWrap.innerHTML = buildSealRing(t, ringSize);
  stage.appendChild(ringWrap);

  // Number wrap
  const numWrap = document.createElement('div');
  numWrap.className = 'sa-num-wrap';

  // Badge (milestone only)
  if (t.badge) {
    const badge = document.createElement('div');
    badge.className = 'sa-badge';
    badge.style.cssText = `background:${t.badge.bg};border:1px solid ${t.badge.border};color:${t.badge.color};`;
    badge.textContent = t.badge.text;
    numWrap.appendChild(badge);
  }

  // Flame
  const flame = document.createElement('div');
  flame.className = 'sa-flame';
  flame.style.fontSize = t.flameSize + 'px';
  flame.textContent = '🔥';
  numWrap.appendChild(flame);

  // Number
  const num = document.createElement('div');
  num.className = 'sa-number';
  num.style.cssText = `
    font-size:${t.numSize}px;
    background:linear-gradient(135deg,${t.numGradient.join(',')});
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    filter:drop-shadow(0 0 28px ${t.glowColor});
    --glow:${t.glowColor};
  `;
  num.textContent = n;
  numWrap.appendChild(num);

  stage.appendChild(numWrap);

  // Streak label
  const lbl = document.createElement('div');
  lbl.className = 'sa-label-streak';
  lbl.style.color = t.streakLabelColor;
  lbl.textContent = 'Day Streak';
  stage.appendChild(lbl);

  // Day label
  const dayLbl = document.createElement('div');
  dayLbl.className = 'sa-label-day';
  dayLbl.textContent = getOrdinal(n) + ' day complete';
  stage.appendChild(dayLbl);

  // Milestone sub-label
  if (n >= 30) {
    const milestones = {30:'One month of showing up.',60:'Two months. Uncommon.',100:'100 days. The identity is set.',200:'200 days. This is who you are.',365:'A full year. Every day you could have stopped. You didn\'t.'};
    const sub = document.createElement('div');
    sub.className = 'sa-label-sub';
    sub.style.color = t.streakLabelColor;
    sub.style.opacity = '0.65';
    sub.style.fontStyle = 'italic';
    sub.style.fontSize = '10px';
    sub.style.maxWidth = '240px';
    sub.style.textAlign = 'center';
    sub.style.letterSpacing = '0.5px';
    sub.style.textTransform = 'none';
    sub.textContent = milestones[n] || '';
    stage.appendChild(sub);
  }

  // Dismiss
  const dismiss = document.createElement('div');
  dismiss.className = 'sa-dismiss';
  dismiss.textContent = 'tap to continue';
  stage.appendChild(dismiss);

  overlay.appendChild(stage);
  document.body.appendChild(overlay);

  overlay.addEventListener('click', () => {
    overlay.classList.add('out');
    setTimeout(() => overlay.remove(), 350);
  });

  setTimeout(() => {
    overlay.classList.add('out');
    setTimeout(() => overlay.remove(), 350);
  }, 5000);
}
</script>
</body>
</html>
